# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy / load balancer for the Invoice Automation system.
#
# Topology this fronts:
#
#     internet ──▶ nginx (this) :80/:443
#                    ├── /            → React static build (frontend/dist)
#                    ├── /api/        → Node API (PM2 cluster, upstream below)
#                    └── /uploads/    → invoice files (served from disk directly)
#
# The Python ML service (:8000) is NOT exposed here — only the Node backend
# talks to it, over the private network/localhost. Keep it that way.
#
# Install:
#   sudo cp deploy/nginx/invoice-automation.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/invoice-automation.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Backend upstream. PM2 cluster mode runs N Node processes behind a SINGLE
# listening socket (the PM2 master load-balances internally), so one entry is
# enough. If instead you run separate Node processes on distinct ports — or on
# other machines — list them all here and nginx will round-robin across them.
upstream invoice_api {
    server 127.0.0.1:5000;
    # server 127.0.0.1:5001;          # extra local instance (non-cluster setup)
    # server 10.0.0.12:5000;          # another machine
    keepalive 32;                      # reuse upstream connections
}

# Redirect all plain HTTP to HTTPS. Comment this block out if you're terminating
# TLS elsewhere (e.g. a cloud LB) or running HTTP-only on a private network.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── TLS ───────────────────────────────────────────────────────────────────
    # Point these at your certs. For a quick self-signed dev cert:
    #   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/invoice-selfsigned.key \
    #     -out /etc/ssl/certs/invoice-selfsigned.crt
    # For production use Let's Encrypt (certbot) instead.
    ssl_certificate     /etc/ssl/certs/invoice-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/invoice-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Upload size ─────────────────────────────────────────────────────────────
    # Must be >= the backend's multer limit (10 MB) plus a little multipart
    # overhead, otherwise nginx rejects the upload with 413 before it ever
    # reaches Node. Keep these two numbers in sync.
    client_max_body_size 12M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"     always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # ── Frontend: static React build ──────────────────────────────────────────
    # `npm run build` in frontend/ emits to frontend/dist. Copy/symlink that to
    # the path below (or point root straight at the repo's frontend/dist).
    root  /var/www/invoice-automation/frontend/dist;
    index index.html;

    # Hashed assets (Vite fingerprints filenames) can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route returns index.html so React Router can
    # handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API: proxy to the Node backend ────────────────────────────────────────
    location /api/ {
        proxy_pass http://invoice_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR/matching can run inline (queue disabled) and take tens of seconds;
        # the ML /extract path alone allows 60s in the Node client. Give the
        # proxy comparable headroom so a legitimately slow request isn't cut off.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # ── Uploaded invoice files ────────────────────────────────────────────────
    # Served straight off disk by nginx (faster than proxying through Node).
    # Point this at the backend's uploads/ directory. NOTE: this only works when
    # nginx and the files are on the same host — once you scale workers across
    # machines, move to shared object storage (MinIO, roadmap Step 7) and proxy
    # /uploads to it instead.
    location /uploads/ {
        alias /var/www/invoice-automation/backend/uploads/;
        expires 7d;
        add_header Cache-Control "private";
        # Invoices are not public data; require the app to have authenticated the
        # user. If you need hard access control on the files themselves, drop the
        # alias and proxy /uploads to the Node backend so it can authorise first.
    }

    # Health check passthrough (handy for external uptime monitors / LBs).
    location = /api/health {
        proxy_pass http://invoice_api;
        access_log off;
    }
}
